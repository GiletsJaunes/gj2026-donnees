name: Veille Telegram (blocus)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les canaux Telegram de confiance
        run: python3 scripts/telegram.py data
      - name: Enregistrer
        run: |
          git config user.name "veille-automatique"
          git config user.email "veille@users.noreply.github.com"
          git add data/blocus.json data/blocus_ignores.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Blocus Telegram : mise à jour automatique"
            git pull --rebase
            git push
          fi
