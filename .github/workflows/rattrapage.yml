name: Rattrapage du barometre

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relire la presse depuis le 10 septembre
        run: python3 scripts/rattrapage.py
      - name: Enregistrer les chiffres
        run: |
          git config user.name "veille-automatique"
          git config user.email "veille@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Rattrapage du barometre depuis le 10 septembre"
            git pull --rebase
            git push
          fi